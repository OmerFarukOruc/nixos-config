name: update

# Moves the apps in pkgs/ and the flake inputs to their newest releases
# (scripts/prepare-update.sh), as two commits on the same main. Each commit is
# made, checked and merged to main by its own jobs, so a failing input move
# never holds back an app, nor the other way round. The apps commit runs the
# checks of the pre-push hook; the inputs commit also builds every host's
# system. Hosts compile the packages that no
# public cache holds themselves, so nothing is pushed to a cache here.
# nixos-rog deploys main by itself (scripts/pull-main.sh).
on:
  # Every 6 hours. The cold nixos-rog build job took 95 to 102 min on
  # 2026-10-27 (docs/nixos-rog.md).
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      always:
        description: Build and check main itself when no input moved
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

env:
  # The substituters every host reads (nixosModules/common.nix and
  # nixosModules/kernel.nix), so the runner downloads what a host downloads.
  # Downloads from cache.numtide.com fail with "Stream error in the HTTP/2
  # framing layer" over HTTP/2.
  NIX_EXTRA: |
    extra-substituters = https://cache.numtide.com https://omerfarukoruc.cachix.org
    extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= omerfarukoruc.cachix.org-1:6OxbnSmF+Agsn0w9aya633NTlxjxXAtsETYNcImB87c=
    http2 = false

jobs:
  # The main both prepare jobs start from, so their commits share one parent.
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

  # Only the merge jobs push. The prepare jobs run the moved apps' and inputs'
  # code, so their checkouts keep no token in .git/config. Each job commits its
  # moves on base and hands the commit on in a bundle, so the later jobs check
  # the same commit.
  prepare-apps:
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      moved: ${{ steps.commit.outputs.moved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.base.outputs.sha }}
          persist-credentials: false
      # An app that moves downloads its release, which can take gigabytes.
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: ${{ env.NIX_EXTRA }}
      - name: Move the apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prepare-update.sh apps nixos-rog "$RUNNER_TEMP/apps"
      - id: commit
        run: |
          if [[ ! -s $RUNNER_TEMP/apps ]]; then
            echo "Every app is current, or stays where it is." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n\n' "chore(pkgs): update apps to their newest releases" | cat - "$RUNNER_TEMP/apps" >"$RUNNER_TEMP/message"
          git add -u -- pkgs
          if [[ -n $(git status --porcelain --untracked-files=no -- . ':!pkgs') ]]; then
            git status --short >&2
            echo "::error::The app moves changed files outside pkgs/."
            exit 1
          fi
          git commit --quiet -F "$RUNNER_TEMP/message"
          git bundle create "$RUNNER_TEMP/apps.bundle" "HEAD^..HEAD"
          {
            echo '```text'
            cat "$RUNNER_TEMP/apps"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          echo "moved=true" >>"$GITHUB_OUTPUT"
      - if: steps.commit.outputs.moved == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-bundle
          path: ${{ runner.temp }}/apps.bundle
          if-no-files-found: error
          # A re-run of all jobs uploads it again within the same run.
          overwrite: true
          retention-days: 1

  prepare-inputs:
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
      # true for the inputs commit or for the empty commit of always.
      build: ${{ steps.commit.outputs.build }}
      # true only for an inputs commit, not for the empty commit of always.
      moved: ${{ steps.commit.outputs.moved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.base.outputs.sha }}
          persist-credentials: false
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: ${{ env.NIX_EXTRA }}
      - id: hosts
        run: echo "hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)" >>"$GITHUB_OUTPUT"
      - name: Move the inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prepare-update.sh inputs nixos-rog "$RUNNER_TEMP/inputs"
      - id: commit
        env:
          ALWAYS: ${{ inputs.always }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ ! -s $RUNNER_TEMP/inputs ]]; then
            echo "Every input is current, or stays where it is." >>"$GITHUB_STEP_SUMMARY"
            [[ $ALWAYS == true ]] || exit 0
            # An empty commit, so the build and check jobs run on main's tree.
            echo "always=true: the build and check jobs run on main itself." >>"$GITHUB_STEP_SUMMARY"
            git commit --quiet --allow-empty -m "test: build and check main"
            git bundle create "$RUNNER_TEMP/inputs.bundle" "HEAD^..HEAD"
            echo "build=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n\n' "chore(flake): update inputs to their newest releases" | cat - "$RUNNER_TEMP/inputs" >"$RUNNER_TEMP/message"
          # Only the files an update moves. The run executed the updated
          # inputs' code, so an edit anywhere else fails it.
          git add -u -- flake.nix flake.lock devenv.lock pkgs
          if [[ -n $(git status --porcelain --untracked-files=no -- . ':!flake.nix' ':!flake.lock' ':!devenv.lock' ':!pkgs') ]]; then
            git status --short >&2
            echo "::error::The input moves changed files outside flake.nix, flake.lock, devenv.lock and pkgs/."
            exit 1
          fi
          git commit --quiet -F "$RUNNER_TEMP/message"
          git bundle create "$RUNNER_TEMP/inputs.bundle" "HEAD^..HEAD"
          {
            echo '```text'
            cat "$RUNNER_TEMP/inputs"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          printf 'build=true\nmoved=true\n' >>"$GITHUB_OUTPUT"
      - if: steps.commit.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inputs-bundle
          path: ${{ runner.temp }}/inputs.bundle
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # Each app already built on its own in prepare-apps. ci/checks.sh evaluates
  # every host's system with the moved apps.
  check-apps:
    needs: [base, prepare-apps]
    if: needs.prepare-apps.outputs.moved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.base.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-bundle
          path: ${{ runner.temp }}
      - name: Check out the apps commit
        run: |
          git fetch --quiet "$RUNNER_TEMP/apps.bundle" HEAD
          git checkout --quiet --detach FETCH_HEAD
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: ${{ env.NIX_EXTRA }}
      - name: ci/checks.sh
        run: ci/checks.sh
      # ci/checks.sh forbids import from derivation itself; this covers
      # ci/unit-cycles.sh too.
      - name: ci/unit-cycles.sh
        env:
          NIX_CONFIG: allow-import-from-derivation = false
        run: ci/unit-cycles.sh

  build:
    needs: [base, prepare-inputs]
    if: needs.prepare-inputs.outputs.build == 'true'
    runs-on: ubuntu-latest
    # The cold nixos-rog build job took 95 to 102 min on 2026-10-27
    # (docs/nixos-rog.md). Each try of the build step below ends after 150 min,
    # long before a stalled build would reach GitHub's 6 h job limit.
    timeout-minutes: 320
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.prepare-inputs.outputs.hosts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.base.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inputs-bundle
          path: ${{ runner.temp }}
      - name: Check out the inputs commit
        run: |
          git fetch --quiet "$RUNNER_TEMP/inputs.bundle" HEAD
          git checkout --quiet --detach FETCH_HEAD
      # A host's system with its unfree apps needs more than the runner's free
      # disk.
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: ${{ env.NIX_EXTRA }}
      # A second try only after a failed download, such as a substituter
      # timeout; an evaluation or compile error fails at once.
      - name: Build ${{ matrix.host }}
        env:
          HOST: ${{ matrix.host }}
        run: |
          set -o pipefail
          log=$RUNNER_TEMP/build.log
          timeout 150m ci/build-hosts.sh "$HOST" 2>&1 | tee "$log" && exit 0
          # Nix also prints these as warnings for downloads it retries itself.
          if grep '^error:' "$log" | grep -qE 'unable to download|some substitutes|curl error'; then
            echo "::warning::A download failed while building $HOST; trying once more."
            timeout 150m ci/build-hosts.sh "$HOST" 2>&1 | tee "$log" && exit 0
          fi
          # shellcheck source=/dev/null
          . scripts/lib/build-error.sh
          echo "Build of $HOST failed: $(build_error "$log")" >>"$GITHUB_STEP_SUMMARY"
          exit 1

  check:
    needs: [base, prepare-inputs]
    if: needs.prepare-inputs.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.base.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inputs-bundle
          path: ${{ runner.temp }}
      - name: Check out the inputs commit
        run: |
          git fetch --quiet "$RUNNER_TEMP/inputs.bundle" HEAD
          git checkout --quiet --detach FETCH_HEAD
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: ${{ env.NIX_EXTRA }}
      - name: ci/checks.sh
        run: ci/checks.sh
      - name: ci/unit-cycles.sh
        env:
          NIX_CONFIG: allow-import-from-derivation = false
        run: ci/unit-cycles.sh

  # main moves several times a day, and a run takes up to a few hours. Each
  # place job puts its commit on the current main (ci/place-update.sh); when
  # that changes the checked tree, both checks run again on the result. The
  # new main's own commits passed them at their push.
  place-apps:
    needs: [base, check-apps]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ready: ${{ steps.place.outputs.ready }}
      parent: ${{ steps.place.outputs.parent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-bundle
          path: ${{ runner.temp }}
      - id: place
        env:
          BASE: ${{ needs.base.outputs.sha }}
        run: ci/place-update.sh --per-app "$BASE" "$RUNNER_TEMP/apps.bundle" "$RUNNER_TEMP/merge.bundle" >>"$GITHUB_OUTPUT"
      - if: steps.place.outputs.recheck == 'true'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: ${{ env.NIX_EXTRA }}
      - if: steps.place.outputs.recheck == 'true'
        name: ci/checks.sh
        run: ci/checks.sh
      - if: steps.place.outputs.recheck == 'true'
        name: ci/unit-cycles.sh
        env:
          NIX_CONFIG: allow-import-from-derivation = false
        run: ci/unit-cycles.sh
      - if: steps.place.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merge-apps-bundle
          path: ${{ runner.temp }}/merge.bundle
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # Only the merge jobs may push. Each runs main's ci/merge-update.sh and no
  # code of the update or its inputs.
  merge-apps:
    needs: place-apps
    if: needs.place-apps.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: merge-apps-bundle
          path: ${{ runner.temp }}
      - name: Push the apps commit to main
        env:
          PARENT: ${{ needs.place-apps.outputs.parent }}
        run: ci/merge-update.sh "$PARENT" "$RUNNER_TEMP/merge.bundle" pkgs

  # Waits for the apps commit, so the inputs commit goes on top of it. A
  # failed or skipped apps path does not hold the inputs back.
  place-inputs:
    needs: [base, prepare-inputs, build, check, merge-apps]
    if: >-
      !cancelled() && needs.prepare-inputs.outputs.moved == 'true'
      && needs.build.result == 'success' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ready: ${{ steps.place.outputs.ready }}
      parent: ${{ steps.place.outputs.parent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inputs-bundle
          path: ${{ runner.temp }}
      - id: place
        env:
          BASE: ${{ needs.base.outputs.sha }}
        run: ci/place-update.sh "$BASE" "$RUNNER_TEMP/inputs.bundle" "$RUNNER_TEMP/merge.bundle" >>"$GITHUB_OUTPUT"
      - if: steps.place.outputs.recheck == 'true'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: ${{ env.NIX_EXTRA }}
      - if: steps.place.outputs.recheck == 'true'
        name: ci/checks.sh
        run: ci/checks.sh
      - if: steps.place.outputs.recheck == 'true'
        name: ci/unit-cycles.sh
        env:
          NIX_CONFIG: allow-import-from-derivation = false
        run: ci/unit-cycles.sh
      - if: steps.place.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merge-inputs-bundle
          path: ${{ runner.temp }}/merge.bundle
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # Without !cancelled(), GitHub skips this job whenever merge-apps, a job
  # place-inputs waits for, failed or was skipped.
  merge-inputs:
    needs: place-inputs
    if: >-
      !cancelled() && needs.place-inputs.result == 'success'
      && needs.place-inputs.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: merge-inputs-bundle
          path: ${{ runner.temp }}
      - name: Push the inputs commit to main
        env:
          PARENT: ${{ needs.place-inputs.outputs.parent }}
        run: ci/merge-update.sh "$PARENT" "$RUNNER_TEMP/merge.bundle" flake.nix flake.lock devenv.lock pkgs

  # A skipped merge job ends the run as a success, so GitHub mails nothing.
  merged:
    needs: [place-apps, merge-apps, place-inputs, merge-inputs]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that each ready commit's merge job succeeded
        env:
          APPS_PLACE: ${{ needs.place-apps.result }}
          APPS_READY: ${{ needs.place-apps.outputs.ready }}
          APPS_MERGE: ${{ needs.merge-apps.result }}
          INPUTS_PLACE: ${{ needs.place-inputs.result }}
          INPUTS_READY: ${{ needs.place-inputs.outputs.ready }}
          INPUTS_MERGE: ${{ needs.merge-inputs.result }}
        run: |
          status=0
          unmerged() {
            local commit=$1 place=$2 ready=$3 merge=$4
            if [[ $place == success && $ready == true && $merge != success ]]; then
              echo "::error::The $commit commit was ready to merge, but merge-$commit ended as $merge."
              status=1
            fi
          }
          unmerged apps "$APPS_PLACE" "$APPS_READY" "$APPS_MERGE"
          unmerged inputs "$INPUTS_PLACE" "$INPUTS_READY" "$INPUTS_MERGE"
          exit "$status"
