name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# The updater's PR (branch auto-update of this repository) runs these checks on
# nixos-rog and merges at once (scripts/auto-update.sh), so they run on its
# push to main. A push has no pull_request, so the condition holds there.
jobs:
  check:
    if: github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'auto-update'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            allow-import-from-derivation = false
      # nix flake check passes an input that flake.lock lacks and only warns,
      # and nix fmt writes the lock file, so this step runs first.
      - name: Check lock files
        run: |
          nix flake metadata --no-update-lock-file . >/dev/null
          nix flake metadata --no-update-lock-file ./kernel-cache >/dev/null
      - name: Check formatting
        run: nix fmt -- --ci
      - name: Check flake outputs
        run: nix flake check --no-build --no-write-lock-file
      - name: Evaluate kernel-cache packages
        run: |
          nix eval --json --no-write-lock-file ./kernel-cache#packages.x86_64-linux \
            --apply 'builtins.mapAttrs (_: p: p.drvPath)'
      # Not a flake output, so the steps above do not evaluate it.
      - name: Evaluate the cached host packages
        run: |
          nix eval --json --impure --expr 'import ./ci/cached-packages.nix (builtins.getFlake (toString ./.))' \
            --apply 'builtins.mapAttrs (_: builtins.mapAttrs (_: p: p.drvPath))'

  # One Nix evaluation uses one core, so each host evaluates in the
  # background, beside the check job on its own runner.
  hosts:
    if: github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'auto-update'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            allow-import-from-derivation = false
      - name: Evaluate host systems
        shell: bash
        run: |
          hosts=$(nix eval --json --no-write-lock-file .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]')
          if [[ -z $hosts ]]; then
            echo "The flake defines no host." >&2
            exit 1
          fi
          declare -A pids
          for host in $hosts; do
            nix eval --raw --no-write-lock-file ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath" \
              >"$RUNNER_TEMP/drv-$host" 2>"$RUNNER_TEMP/eval-$host.log" &
            pids[$host]=$!
            wait "${pids[$host]}" || true
          done
          status=0
          for host in $hosts; do
            rc=0
            wait "${pids[$host]}" || rc=$?
            cat "$RUNNER_TEMP/eval-$host.log" >&2
            if ((rc == 0)); then
              echo "$host: $(<"$RUNNER_TEMP/drv-$host")"
            else
              echo "::error::$host does not evaluate (exit $rc); its log is above."
              status=1
            fi
          done
          # Warnings do not fail the job, so a warning from an upstream input
          # never blocks the updater; each one shows as an annotation.
          warnings=$(cat "$RUNNER_TEMP"/eval-*.log | grep -o 'evaluation warning: .*' | sort -u || true)
          if [[ -z $warnings ]]; then
            echo "No evaluation warnings." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "$(wc -l <<<"$warnings") distinct evaluation warnings:" >>"$GITHUB_STEP_SUMMARY"
            while read -r warning; do
              echo "::warning title=Evaluation warning::${warning#evaluation warning: }"
              echo "- ${warning#evaluation warning: }" >>"$GITHUB_STEP_SUMMARY"
            done <<<"$warnings"
          fi
          exit "$status"

  # deploy.sh refuses a system whose units hold an ordering cycle (exit 80);
  # this job finds the cycle before the merge.
  unit-cycles:
    if: github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'auto-update'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            allow-import-from-derivation = false
      - name: Check each host's units for an ordering cycle
        run: ci/unit-cycles.sh
