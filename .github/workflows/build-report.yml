name: build-report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-report
  cancel-in-progress: true

jobs:
  # Lists, in the job summary, what each host would compile itself after a
  # fresh install, because none of its caches holds a build.
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      # The log gets the report too, because gh cannot read a job summary. The
      # default shell lacks pipefail, so a failing script would pass.
      - name: Report what each host builds
        shell: bash
        run: ci/build-report.sh | tee -a "$GITHUB_STEP_SUMMARY"
