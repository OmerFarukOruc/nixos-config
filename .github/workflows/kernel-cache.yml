name: kernel-cache

on:
  push:
    branches: [main]
    paths:
      - kernel-cache/flake.*
      - kernel-cache/nvidia-driver.nix
      - kernel-cache/patches/**
      - kernel-cache/kernel-module-certs.nix
      - .github/workflows/kernel-cache.yml
  workflow_dispatch:
    inputs:
      rev:
        description: nix-cachyos-kernel revision to build and record (default the locked one)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: kernel-cache
  cancel-in-progress: false

defaults:
  run:
    working-directory: kernel-cache

jobs:
  lock:
    if: vars.CACHIX_CACHE != ''
    runs-on: ubuntu-latest
    outputs:
      rev: ${{ steps.rev.outputs.rev }}
      sha: ${{ steps.rev.outputs.sha }}
      variants: ${{ steps.rev.outputs.variants }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Use the requested revision
        if: inputs.rev != ''
        env:
          REV: ${{ inputs.rev }}
        run: |
          [[ $REV =~ ^[0-9a-f]{40}$ ]] || { echo "rev must be a full commit SHA" >&2; exit 1; }
          nix flake lock --override-input nix-cachyos-kernel "github:xddxdd/nix-cachyos-kernel/$REV"
      - id: rev
        run: |
          {
            echo "rev=$(jq -r '.nodes["nix-cachyos-kernel"].locked.rev' flake.lock)"
            echo "sha=$(git rev-parse HEAD)"
            echo "variants=$(nix eval --json .#variants)"
          } >>"$GITHUB_OUTPUT"

  build:
    needs: lock
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.lock.outputs.variants) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.lock.outputs.sha }}

      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Lock the chosen revision
        run: nix flake lock --override-input nix-cachyos-kernel "github:xddxdd/nix-cachyos-kernel/${{ needs.lock.outputs.rev }}"

      - name: Show the runner's CPU
        run: |
          echo "$(nproc) CPUs: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
          free -g | head -2

      - name: Build the kernel, its modules and its tools
        run: |
          installables=$(nix eval --raw '.#installables.${{ matrix.variant }}')
          read -ra targets <<<"$installables"
          nix build --print-build-logs --no-link --print-out-paths "${targets[@]}" >"$RUNNER_TEMP/paths"

      - name: Push to Cachix
        run: cachix push "${{ vars.CACHIX_CACHE }}" <"$RUNNER_TEMP/paths"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-paths-${{ matrix.variant }}
          path: ${{ runner.temp }}/paths
          if-no-files-found: error

  record:
    needs: [lock, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.lock.outputs.sha }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Stop when main changed the kernel build
        run: |
          git fetch --no-tags origin main
          if ! git diff --quiet "${{ needs.lock.outputs.sha }}" origin/main -- . ':(exclude)flake.lock'; then
            echo "main changed kernel-cache nix or patches after ${{ needs.lock.outputs.sha }}. The queued run records."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kernel-paths-*
          path: ${{ github.workspace }}/kernel-paths

      - name: Lock the chosen revision
        run: nix flake lock --override-input nix-cachyos-kernel "github:xddxdd/nix-cachyos-kernel/${{ needs.lock.outputs.rev }}"

      - name: Record the cached paths
        run: |
          version=$(nix eval --raw '.#packages.x86_64-linux.kernel-x86_64-v3.version')
          find "$GITHUB_WORKSPACE/kernel-paths" -type f -name paths -print0 | xargs -0 cat | sort -u >all-paths
          jq -R -s --arg rev "${{ needs.lock.outputs.rev }}" --arg version "$version" \
            '{ rev: $rev, version: $version, paths: (split("\n") | map(select(length > 0))) }' \
            all-paths >cached-paths.json

      - name: Commit the lock and the cached paths
        run: |
          if git diff --quiet -- flake.lock cached-paths.json && git ls-files --error-unmatch cached-paths.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock cached-paths.json
          git commit -m "chore: record the cached nix-cachyos-kernel build"
          git branch -f kernel-cache-record HEAD
          git switch kernel-cache-record
          git pull --rebase origin main
          git push origin HEAD:main
