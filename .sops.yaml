# Recipients of the encrypted files under secrets/. Omer edits them with the
# SSH key he shares across his devices, ~/.ssh/id_ed25519_omer; each host
# decrypts its own file with the age key derived from its SSH host key
# (ssh-to-age on /etc/ssh/ssh_host_ed25519_key.pub).
keys:
  - &omer-all-devices ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMV6Kg6JIDEOFDbA5ezTsHnxFq2fXzB75x0+tybHlB/h
  - &nixos-rog age1dv44zphjr702d598p7p4p35vk7834ttr8escl6geg0cuxx3mcukq6gm6gl
creation_rules:
  - path_regex: secrets/nixos-rog\.yaml$
    key_groups:
      - age:
          - *omer-all-devices
          - *nixos-rog
