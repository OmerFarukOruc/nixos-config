services:
  threadsift:
    image: ${THREADSIFT_IMAGE:?set THREADSIFT_IMAGE}
    pull_policy: never
    container_name: threadsift
    restart: unless-stopped
    userns_mode: "keep-id:uid=1000,gid=1000"
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/node:size=256m,mode=1777
    mem_limit: 2g
    pids_limit: 512
    environment:
      TZ: Europe/Istanbul
      THREADSIFT_PUBLIC_ORIGIN: ${THREADSIFT_PUBLIC_ORIGIN:?set THREADSIFT_PUBLIC_ORIGIN}
      THREADSIFT_SECRET_KEY: ${THREADSIFT_SECRET_KEY:?set THREADSIFT_SECRET_KEY}
      SETUP_CODE: ${SETUP_CODE:?set SETUP_CODE}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?set CLAUDE_CODE_OAUTH_TOKEN}
    ports:
      - "127.0.0.1:${THREADSIFT_PORT:?set THREADSIFT_PORT}:8080"
    volumes:
      - ${THREADSIFT_DATA_PATH:?set THREADSIFT_DATA_PATH}:/data

  cloudflared:
    image: docker.io/cloudflare/cloudflared:2026.11.1@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
    pull_policy: missing
    container_name: threadsift-cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:20241", "run"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    pids_limit: 128
    environment:
      TZ: Europe/Istanbul
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN}
    ports:
      - "127.0.0.1:${THREADSIFT_TUNNEL_PORT:?set THREADSIFT_TUNNEL_PORT}:20241"
    depends_on:
      - threadsift
