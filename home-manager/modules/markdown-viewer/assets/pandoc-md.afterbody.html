<script>
/* Pandoc Markdown Viewer — runtime enhancements (included via pandoc -A).
   Progressive: every block degrades gracefully if a feature is unused. */
(function () {
  'use strict';

  /* ── 1. Mermaid diagrams: convert ```mermaid fences, lazy-load renderer.
     The theme variables come from the page's CSS tokens, so the diagrams
     use the active scheme. ── */
  var mermaidNodes = [], seen = new Set();
  document.querySelectorAll('pre.mermaid, code.mermaid, code.language-mermaid').forEach(function (el) {
    var wrapper = el.closest('div.sourceCode') || (el.tagName === 'PRE' ? el : el.closest('pre'));
    if (!wrapper || seen.has(wrapper)) return;
    seen.add(wrapper);
    var pre = document.createElement('pre');
    pre.className = 'mermaid';
    pre.textContent = el.textContent;
    wrapper.replaceWith(pre);
    mermaidNodes.push(pre);
  });
  if (mermaidNodes.length) {
    var css = getComputedStyle(document.documentElement);
    function token(name) { return css.getPropertyValue('--' + name).trim(); }
    /* The tokens are #rrggbb. Mermaid's base theme derives its category colors
       (pie slices, git branches, journey and timeline sections) from the
       primary, secondary and tertiary colors, which are page backgrounds here.
       The category variables below come from the accent tokens instead. */
    function rgb(c) { return [1, 3, 5].map(function (i) { return parseInt(c.substr(i, 2), 16); }); }
    function lum(c) {
      var v = rgb(c).map(function (x) { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); });
      return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
    }
    function contrast(a, b) {
      var x = lum(a), y = lum(b);
      return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
    }
    function mix(a, b, share) {
      var x = rgb(a), y = rgb(b);
      return '#' + x.map(function (v, i) {
        return ('0' + Math.round(v * share + y[i] * (1 - share)).toString(16)).slice(-2);
      }).join('');
    }
    /* Journey text uses the page text color on every fill, so its fills are the
       accents faded into the page background until that text reads. */
    function fadedFor(accent) {
      for (var share = 0.6; share > 0.1; share -= 0.05) {
        var c = mix(accent, token('bg'), share);
        if (contrast(c, token('fg')) >= 4.5) return c;
      }
      return mix(accent, token('bg'), 0.1);
    }
    function readableOn(fills) {
      var best = null, bestMin = 0;
      [token('bg'), token('fg')].forEach(function (c) {
        var min = Math.min.apply(null, fills.map(function (f) { return contrast(c, f); }));
        if (min > bestMin) { best = c; bestMin = min; }
      });
      return best;
    }
    var accents = ['red', 'orange', 'yellow', 'green', 'blue', 'purple', 'cyan'].map(token);
    var cats = accents.concat(accents.slice(0, 5).map(function (a) { return mix(a, token('fg'), 0.6); }));
    var vars = {
      darkMode: css.colorScheme === 'dark',
      background: token('bg'),
      fontFamily: getComputedStyle(document.body).fontFamily,
      primaryColor: token('bg-secondary'),
      primaryTextColor: token('fg'),
      primaryBorderColor: token('border-hover'),
      secondaryColor: token('bg-code'),
      tertiaryColor: token('bg'),
      lineColor: token('fg-muted'),
      arrowheadColor: token('fg-muted'),
      textColor: token('fg'),
      mainBkg: token('bg-secondary'),
      nodeBorder: token('border-hover'),
      clusterBkg: token('bg'),
      clusterBorder: token('border'),
      titleColor: token('fg'),
      edgeLabelBackground: token('bg'),
      noteBkgColor: token('bg-secondary'),
      noteTextColor: token('fg'),
      noteBorderColor: token('border-hover'),
      errorBkgColor: token('bg-secondary'),
      errorTextColor: token('red'),
      pieOpacity: '1',
      pieStrokeColor: token('bg'),
      pieOuterStrokeColor: token('border'),
      pieSectionTextColor: readableOn(cats),
      xyChart: {
        backgroundColor: token('bg'),
        titleColor: token('fg'),
        dataLabelColor: token('fg'),
        legendTextColor: token('fg'),
        xAxisTitleColor: token('fg'),
        xAxisLabelColor: token('fg'),
        xAxisTickColor: token('fg-muted'),
        xAxisLineColor: token('fg-muted'),
        yAxisTitleColor: token('fg'),
        yAxisLabelColor: token('fg'),
        yAxisTickColor: token('fg-muted'),
        yAxisLineColor: token('fg-muted'),
        plotColorPalette: cats.join(',')
      }
    };
    cats.forEach(function (c, i) {
      vars['pie' + (i + 1)] = c;
      vars['cScale' + i] = c;
      vars['cScalePeer' + i] = mix(c, token('fg'), 0.8);
      vars['cScaleLabel' + i] = readableOn([c]);
      vars['cScaleInv' + i] = readableOn([c]);
      if (i < 8) {
        vars['git' + i] = c;
        vars['gitInv' + i] = readableOn([c]);
        vars['gitBranchLabel' + i] = readableOn([c]);
        vars['fillType' + i] = fadedFor(c);
        vars['venn' + (i + 1)] = c;
      }
    });
    /* Gantt: bars are accents faded into the page background, so the page
       text color reads on every bar, inside and outside. Mermaid draws the
       section bands at 0.2 opacity and the weekend ranges at full opacity. */
    Object.assign(vars, {
      sectionBkgColor: token('blue'),
      altSectionBkgColor: token('fg'),
      sectionBkgColor2: token('purple'),
      excludeBkgColor: mix(token('fg'), token('bg'), 0.12),
      gridColor: token('border-hover'),
      todayLineColor: token('red'),
      vertLineColor: token('cyan'),
      taskBkgColor: fadedFor(token('blue')),
      taskBorderColor: token('blue'),
      activeTaskBkgColor: fadedFor(token('green')),
      activeTaskBorderColor: token('green'),
      doneTaskBkgColor: fadedFor(token('fg-muted')),
      doneTaskBorderColor: token('fg-muted'),
      critBkgColor: fadedFor(token('red')),
      critBorderColor: token('red'),
      taskTextColor: token('fg'),
      taskTextOutsideColor: token('fg'),
      taskTextLightColor: token('fg'),
      taskTextDarkColor: token('fg'),
      taskTextClickableColor: token('fg')
    });
    /* Version 11.17.2 is the release whose theme variable names this block
       uses. A new release gets a new URL and a new integrity value, so a
       rename cannot reach the viewer unchecked. The integrity value is the
       SHA-384 of mermaid.min.js at that version. */
    var m = document.createElement('script');
    m.src = 'https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js';
    m.integrity = 'sha384-EOXBFmc3gx5mb+vn0vPvvGqACToJD24hhacX5Yx+8NUUQrHIle/Qi5Bg9o3zKwW2';
    m.crossOrigin = 'anonymous';
    m.onload = function () {
      try {
        window.mermaid.initialize({ startOnLoad: false, securityLevel: 'loose', theme: 'base', themeVariables: vars });
        window.mermaid.run({ nodes: Array.prototype.slice.call(document.querySelectorAll('pre.mermaid')) });
      } catch (e) {}
    };
    document.body.appendChild(m);
  }

  /* ── 2. Heading anchor links ── */
  document.querySelectorAll('h1[id], h2[id], h3[id], h4[id]').forEach(function (h) {
    var a = document.createElement('a');
    a.className = 'header-anchor';
    a.href = '#' + h.id;
    a.setAttribute('aria-hidden', 'true');
    a.textContent = '#';
    h.appendChild(a);
  });

  /* ── 3. Code blocks: language badge + copy button ── */
  function copyText(text, btn) {
    function flash(t, cls) {
      btn.textContent = t;
      if (cls) btn.classList.add(cls);
      setTimeout(function () { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
    }
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        flash('Copied', 'copied');
      } catch (e) { flash('Failed', ''); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { flash('Copied', 'copied'); }, fallback);
    } else { fallback(); }
  }
  document.querySelectorAll('div.sourceCode').forEach(function (block) {
    var pre = block.querySelector('pre'), code = block.querySelector('code');
    if (!pre || !code) return;
    var lang = pre.className.split(/\s+/).filter(function (c) { return c && c !== 'sourceCode'; })[0] || '';
    var wrap = document.createElement('div');
    wrap.className = 'code-wrap';
    block.replaceWith(wrap);
    wrap.appendChild(block);
    var meta = document.createElement('div');
    meta.className = 'code-meta';
    if (lang) {
      var badge = document.createElement('span');
      badge.className = 'code-lang';
      badge.textContent = lang;
      meta.appendChild(badge);
    }
    var btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.type = 'button';
    btn.textContent = 'Copy';
    btn.addEventListener('click', function () { copyText(code.textContent, btn); });
    meta.appendChild(btn);
    wrap.appendChild(meta);
  });
  /* GitHub-style alerts (> [!NOTE] etc.) are rendered natively by pandoc's
     gfm reader into div.note/.tip/.important/.warning/.caution and styled in CSS. */
})();
</script>
