<script>
/* Pandoc Markdown Viewer — runtime enhancements (included via pandoc -A).
   Progressive: every block degrades gracefully if a feature is unused. */
(function () {
  'use strict';

  /* ── 1. Mermaid diagrams: convert ```mermaid fences, lazy-load renderer.
     The theme variables come from the page's CSS tokens, so the diagrams
     use the active scheme. ── */
  var mermaidNodes = [], seen = new Set();
  document.querySelectorAll('pre.mermaid, code.mermaid, code.language-mermaid').forEach(function (el) {
    var wrapper = el.closest('div.sourceCode') || (el.tagName === 'PRE' ? el : el.closest('pre'));
    if (!wrapper || seen.has(wrapper)) return;
    seen.add(wrapper);
    var pre = document.createElement('pre');
    pre.className = 'mermaid';
    pre.textContent = el.textContent;
    wrapper.replaceWith(pre);
    mermaidNodes.push(pre);
  });
  if (mermaidNodes.length) {
    var css = getComputedStyle(document.documentElement);
    function token(name) { return css.getPropertyValue('--' + name).trim(); }
    var vars = {
      darkMode: css.colorScheme === 'dark',
      background: token('bg'),
      fontFamily: getComputedStyle(document.body).fontFamily,
      primaryColor: token('bg-secondary'),
      primaryTextColor: token('fg'),
      primaryBorderColor: token('border-hover'),
      secondaryColor: token('bg-code'),
      tertiaryColor: token('bg'),
      lineColor: token('fg-muted'),
      arrowheadColor: token('fg-muted'),
      textColor: token('fg'),
      mainBkg: token('bg-secondary'),
      nodeBorder: token('border-hover'),
      clusterBkg: token('bg'),
      clusterBorder: token('border'),
      titleColor: token('fg'),
      edgeLabelBackground: token('bg'),
      noteBkgColor: token('bg-secondary'),
      noteTextColor: token('fg'),
      noteBorderColor: token('border-hover'),
      errorBkgColor: token('bg-secondary'),
      errorTextColor: token('red')
    };
    var m = document.createElement('script');
    m.type = 'module';
    m.textContent =
      "import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';\n" +
      "try {\n" +
      "  mermaid.initialize({ startOnLoad: false, securityLevel: 'loose', theme: 'base', themeVariables: " + JSON.stringify(vars) + " });\n" +
      "  mermaid.run({ nodes: Array.prototype.slice.call(document.querySelectorAll('pre.mermaid')) });\n" +
      "} catch (e) {}";
    document.body.appendChild(m);
  }

  /* ── 2. Heading anchor links ── */
  document.querySelectorAll('h1[id], h2[id], h3[id], h4[id]').forEach(function (h) {
    var a = document.createElement('a');
    a.className = 'header-anchor';
    a.href = '#' + h.id;
    a.setAttribute('aria-hidden', 'true');
    a.textContent = '#';
    h.appendChild(a);
  });

  /* ── 3. Code blocks: language badge + copy button ── */
  function copyText(text, btn) {
    function flash(t, cls) {
      btn.textContent = t;
      if (cls) btn.classList.add(cls);
      setTimeout(function () { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
    }
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        flash('Copied', 'copied');
      } catch (e) { flash('Failed', ''); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { flash('Copied', 'copied'); }, fallback);
    } else { fallback(); }
  }
  document.querySelectorAll('div.sourceCode').forEach(function (block) {
    var pre = block.querySelector('pre'), code = block.querySelector('code');
    if (!pre || !code) return;
    var lang = pre.className.split(/\s+/).filter(function (c) { return c && c !== 'sourceCode'; })[0] || '';
    var wrap = document.createElement('div');
    wrap.className = 'code-wrap';
    block.replaceWith(wrap);
    wrap.appendChild(block);
    var meta = document.createElement('div');
    meta.className = 'code-meta';
    if (lang) {
      var badge = document.createElement('span');
      badge.className = 'code-lang';
      badge.textContent = lang;
      meta.appendChild(badge);
    }
    var btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.type = 'button';
    btn.textContent = 'Copy';
    btn.addEventListener('click', function () { copyText(code.textContent, btn); });
    meta.appendChild(btn);
    wrap.appendChild(meta);
  });
  /* GitHub-style alerts (> [!NOTE] etc.) are rendered natively by pandoc's
     gfm reader into div.note/.tip/.important/.warning/.caution and styled in CSS. */
})();
</script>
