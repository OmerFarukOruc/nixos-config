"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](surface2)\
$os\
$username\
[](fg:surface2 bg:surface1)\
$directory\
[](fg:surface1 bg:surface2)\
$git_branch\
$git_status\
[](fg:surface2 bg:surface1)\
$c\
$cpp\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:surface1 bg:surface2)\
$docker_context\
[](fg:surface2 bg:surface1)\
$time\
[ ](fg:surface1)\
"""

add_newline = false

[username]
show_always = true
style_user = "fg:base0e bg:surface2"
style_root = "fg:base0e bg:surface2"
format = '[$user ]($style)'
disabled = false

[os]
style = "fg:base0e bg:surface2"
disabled = true

[directory]
style = "fg:base0d bg:surface1"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[c]
symbol = " "
style = "fg:base0b bg:surface1"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "fg:base0b bg:surface1"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "fg:base0c bg:surface2"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "fg:base0b bg:surface1"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "fg:base0b bg:surface1"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "fg:base0a bg:surface2"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:base0a bg:surface2"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "fg:base0b bg:surface1"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "fg:base0b bg:surface1"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "fg:base0b bg:surface1"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "fg:base0b bg:surface1"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "fg:base0b bg:surface1"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "fg:base0b bg:surface1"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "fg:base0b bg:surface1"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "fg:base0b bg:surface1"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "fg:base0b bg:surface1"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "fg:base05 bg:surface1"
format = '[ ♥ $time ]($style)'
