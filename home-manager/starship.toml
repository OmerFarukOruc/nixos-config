"$schema" = 'https://starship.rs/config-schema.json'

# Based on Starship's pastel-powerline preset. Colors are ANSI names, so the
# terminal palette (oruc.theme.ansi) sets them and a scheme change recolors the
# prompt. Starship calls ANSI magenta purple.

format = """
[](purple)\
$os\
$username\
[](bg:red fg:purple)\
$directory\
[](fg:red bg:yellow)\
$git_branch\
$git_status\
[](fg:yellow bg:blue)\
$c\
$cpp\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:blue bg:cyan)\
$docker_context\
[](fg:cyan bg:bright-black)\
$time\
[ ](fg:bright-black)\
"""

# Disable the blank line at the start of the prompt.
add_newline = false

[username]
show_always = true
style_user = "fg:black bg:purple"
style_root = "fg:black bg:purple"
format = '[$user ]($style)'
disabled = false

[os]
style = "fg:black bg:purple"
disabled = true

[directory]
style = "fg:black bg:red"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[c]
symbol = " "
style = "fg:black bg:blue"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "fg:black bg:blue"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "fg:black bg:cyan"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "fg:black bg:blue"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "fg:black bg:blue"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "fg:black bg:yellow"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:black bg:yellow"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "fg:black bg:blue"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "fg:black bg:blue"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "fg:black bg:blue"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "fg:black bg:blue"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "fg:black bg:blue"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "fg:black bg:blue"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "fg:black bg:blue"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "fg:black bg:blue"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "fg:black bg:blue"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "fg:white bg:bright-black"
format = '[ ♥ $time ]($style)'
